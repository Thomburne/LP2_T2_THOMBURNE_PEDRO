
<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Nueva orden de compra - Thomburne Pedro</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-body">

            <h1 class="card-title text-center">
                Orden de compra nueva
            </h1>

            <div class="row d-flex justify-content-center">

                <div class="col-md-8">

                    <form class="row g-3"
                          th:action="@{/orden/registrar}"
                          method="post">

                        <!-- PROVEEDOR -->
                        <div class="col-md-6">

                            <label for="proveedor"
                                   class="form-label">
                                Proveedor
                            </label>

                            <select class="form-select"
                                    id="proveedor"
                                    name="proveedor.idProveedor"
                                    required>

                                <option value="">
                                    --Seleccione--
                                </option>

                                <option th:each="p : ${proveedores}"
                                        th:value="${p.idProveedor}"
                                        th:text="${p.razonSocial}">
                                </option>

                            </select>

                        </div>

                        <!-- MONTO -->
                        <div class="col-md-6">

                            <label for="monto"
                                   class="form-label">
                                Monto
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="monto"
                                   name="monto"
                                   placeholder="0.00"
                                   min="0.01"
                                   step="0.01"
                                   required>

                        </div>

                        <!-- DIRECCIÓN -->
                        <div class="col-md-12">

                            <label for="direccionEntrega"
                                   class="form-label">
                                Dirección de entrega
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="direccionEntrega"
                                   name="direccionEntrega"
                                   maxlength="255"
                                   placeholder="Ingrese una dirección de entrega"
                                   required>

                        </div>

                        <!-- FECHA DE ENTREGA -->
                        <div class="col-md-6">

                            <label for="fechaEntrega"
                                   class="form-label">
                                Fecha de entrega
                            </label>

                            <input type="date"
                                   class="form-control"
                                   id="fechaEntrega"
                                   name="fechaEntrega"
                                   required>

                        </div>

                        <!-- BOTONES -->
                        <div class="col-md-12 d-flex justify-content-between mt-3">

                            <a th:href="@{/orden/listado}"
                               class="btn btn-outline-dark">

                                <i class="fa-solid fa-reply"></i>
                                Regresar

                            </a>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="fa-solid fa-floppy-disk"></i>
                                Registrar

                            </button>

                            <button type="reset"
                                    class="btn btn-secondary">

                                <i class="fa-solid fa-broom"></i>
                                Limpiar

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
