
<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Listado de órdenes - Thomburne Pedro</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<div class="container-fluid mt-5 px-4">

    <div class="card shadow-lg">

        <div class="card-body">

            <div class="row mb-3 align-items-center">

                <div class="col-md-10">
                    <h1 class="card-title">
                        Listado de órdenes de compra
                    </h1>
                </div>

                <div class="col-md-2">

                    <a th:href="@{/orden/nuevo}"
                       class="btn btn-success w-100">

                        <i class="fa-solid fa-plus"></i>
                        Nuevo

                    </a>

                </div>

            </div>

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead class="table-dark text-center">

                        <tr>
                            <th>Número</th>
                            <th>Fecha de entrega</th>
                            <th>Dirección de entrega</th>
                            <th>Proveedor</th>
                            <th>Rubro</th>
                            <th>Página web</th>
                            <th>Monto</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody class="table-secondary text-nowrap">

                        <tr th:each="orden : ${ordenes}">

                            <td th:text="${orden.nroOrden}">
                                1
                            </td>

                            <td th:text="${orden.fechaEntrega}">
                                2025-05-10
                            </td>

                            <td th:text="${orden.direccionEntrega}">
                                Dirección
                            </td>

                            <td th:text="${orden.proveedor.razonSocial}">
                                Proveedor
                            </td>

                            <td th:text="${orden.proveedor.rubro != null ? orden.proveedor.rubro.denominacion : 'Sin rubro'}">
                                Rubro
                            </td>

                            <td th:text="${orden.proveedor.paginaWeb}">
                                Página web
                            </td>

                            <td th:text="${'S/ ' + orden.monto}">
                                S/ 0.00
                            </td>

                            <td class="text-center">

                                <span th:if="${orden.estado == 'P'}"
                                      class="badge bg-warning text-dark">
                                    Pendiente
                                </span>

                                <span th:if="${orden.estado == 'C'}"
                                      class="badge bg-success">
                                    Completado
                                </span>

                                <span th:if="${orden.estado == 'A'}"
                                      class="badge bg-danger">
                                    Anulado
                                </span>

                            </td>

                            <td class="text-center align-middle">

                                <a th:href="@{/orden/editar/{id}(id=${orden.nroOrden})}"
                                   class="btn btn-outline-primary"
                                   title="Editar">

                                    <i class="fa-regular fa-pen-to-square"></i>

                                </a>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(ordenes)}">

                            <td colspan="9"
                                class="text-center text-muted">

                                No existen órdenes de compra registradas.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script th:inline="javascript">

    const mensaje = /*[[${mensaje}]]*/ null;

    if (mensaje !== null && mensaje !== "") {

        Swal.fire({
            title: "Operación exitosa",
            text: mensaje,
            icon: "success",
            confirmButtonText: "Aceptar"
        });

    }

</script>

</body>
</html>
